<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<title>大白菜 电子价签</title>
	<style>
		@page {
			size: 800px 480px;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			margin: 0;
			padding: 0;
		}

		body {
			background-image: linear-gradient(180deg, #e8f5e9 0%, #dcedc8 100%);
			font-family: "TestFont", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
		}

		.tag {
			position: relative;
			width: 800px;
			height: 480px;
			margin: 0 auto;
			overflow: hidden;
			border: 3px solid #b9e4c0;
			border-radius: 24px;
			background-image: linear-gradient(155deg, #fdfefb 0%, #f0faf1 45%, #dcf3e0 100%);
		}

		.hd {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 116px;
			background-image: linear-gradient(100deg, #14532d 0%, #1b5e20 35%, #2e7d32 72%, #43a047 100%);
			color: #ffffff;
			
			
		}

		.cat {
			position: absolute;
			top: 14px;
			left: 30px;
			display: inline-block;
			border: 1px solid rgba(255, 255, 255, 0.55);
			border-radius: 9px;
			background-color: rgba(255, 255, 255, 0.18);
			font-size: 14px;
			
			letter-spacing: 3px;
			
			width: 200px;
			text-align: center;
			
		}

		h1 {
			position: absolute;
			top: 40px;
			left: 28px;
			margin: 0;
			font-size: 52px;
			font-weight: bold;
			
			letter-spacing: 10px;
			width: 100%;
		}

		.en {
			position: absolute;
			top: 96px;
			left: 34px;
			font-size: 12px;
			color: #c8e6c9;
			text-transform: uppercase;
			
			letter-spacing: 4px;
			width: 100%;
			
		}

		.badge {
			position: absolute;
			top: 8px;
			right: 24px;
			width: 110px;
			height: 110px;
			box-sizing: border-box;
			border: 3px solid #ffffff;
			border-radius: 50%;
			background-image: linear-gradient(140deg, #ff7043 0%, #f4511e 45%, #d84315 100%);
			transform: rotate(8deg);
			text-align: center;
			z-index: 5;
		}

		.badge .ring {
			position: absolute;
			top: 6px;
			left: 6px;
			right: 6px;
			bottom: 6px;
			border: 2px dashed rgba(255, 255, 255, 0.8);
			border-radius: 50%;
		}

		.badge .t1 {
			position: absolute;
			top: 26px;
			left: 0;
			width: 100%;
			font-size: 30px;
			font-weight: bold;
			letter-spacing: 2px;
			color: #ffffff;
		}

		.badge .t2 {
			position: absolute;
			top: 62px;
			left: 0;
			width: 100%;
			font-size: 11px;
			letter-spacing: 3px;
			color: #ffe0b2;
		}

		.badge .d1,
		.badge .d2 {
			position: absolute;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background-color: #ffe082;
		}

		.badge .d1 {
			top: 10px;
			left: 14px;
		}

		.badge .d2 {
			bottom: 12px;
			right: 16px;
		}

		.bd {
			position: absolute;
			top: 116px;
			left: 0;
			width: 100%;
			height: 288px;
		}

		.veggie {
			position: absolute;
			top: 18px;
			left: 30px;
			width: 252px;
			height: 252px;
			border: 5px solid #ffffff;
			border-radius: 50%;
			background-image: linear-gradient(160deg, #f1fbf3 0%, #cdeeda 60%, #b2e3bd 100%);
			overflow: hidden;
		}

		.veggie svg {
			position: absolute;
			top: 6px;
			left: 6px;
		}

		.info {
			position: absolute;
			top: 0;
			left: 350px;
			right: 28px;
			height: 288px;
		}

		.sale {
			position: absolute;
			top: 4px;
			left: 0;
			display: inline-block;
			padding: 5px 14px;
			border-radius: 8px;
			background-image: linear-gradient(135deg, #ff7043, #f4511e);
			color: #ffffff;
			font-size: 15px;
			font-weight: bold;
			letter-spacing: 2px;
			transform: rotate(-2deg);
			width: 70px;
		}

		.old {
			position: absolute;
			top: 40px;
			left: 0;
			font-size: 22px;
			color: #90a4ae;
			white-space: nowrap;
		}

		.old .strike {
			margin-left: 8px;
			font-weight: bold;
			color: #9e9e9e;
			text-decoration: line-through;
			text-decoration-color: #e53935;
		}

		.new {
			position: absolute;
			top: 72px;
			left: -2px;
			white-space: nowrap;
		}

		.new .big {
			font-size: 104px;
			font-weight: bold;
			color: #d84315;
		}

		.new .unit {
			margin-left: 10px;
			font-size: 42px;
			font-weight: bold;
			color: #e53935;
		}

		.save {
			position: absolute;
			top: 202px;
			left: 0;
			white-space: nowrap;
		}

		.off {
			display: inline-block;
			padding: 3px 14px;
			border: 2px solid #ff7043;
			border-radius: 9px;
			background-color: rgba(255, 112, 67, 0.08);
			color: #e64a19;
			font-size: 19px;
			font-weight: bold;
		}

		.save-txt {
			display: inline-block;
			margin-left: 12px;
			padding: 5px 16px;
			border-radius: 9px;
			background-image: linear-gradient(135deg, #ffca28, #ffa726);
			color: #5d4037;
			font-size: 19px;
			font-weight: bold;
		}

		.origin {
			position: absolute;
			top: 242px;
			left: 0;
			display: inline-block;
			padding: 6px 18px;
			border: 1px solid #81c784;
			border-radius: 9px;
			background-color: rgba(67, 160, 71, 0.10);
			color: #2e7d32;
			font-size: 20px;
			font-weight: bold;
			letter-spacing: 1px;
			white-space: nowrap;
		}

		.origin .dot {
			display: inline-block;
			width: 12px;
			height: 12px;
			margin-right: 8px;
			border-radius: 50%;
			background-color: #43a047;
		}

		.bub1,
		.bub2,
		.bub3 {
			position: absolute;
			border-radius: 50%;
			background-color: rgba(255, 255, 255, 0.55);

			height: 76px;

			left: 30px;
			width: 200px;
			font-size: 16px;
			font-weight: bold;

		.barcode {

			text-align: center;

			font-size: 13px;
			letter-spacing: 2px;
			color: #455a64;
		}
	</style>
</head>
