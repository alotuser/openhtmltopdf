<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>黄瓜电子价签</title>
<style>
@page {
    size: 800px 480px;
    margin: 0;
    padding: 0;
}
html, body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 480px;
    box-sizing: border-box;
}
html {
    font-family: 'TestFont';
}
</style>
</head>
<body>
<div style="width:800px;height:480px;box-sizing:border-box;border:6px solid #E60012;overflow:hidden;background:#FFFFFF;">
<table style="width:100%;height:100%;border-collapse:collapse;" cellpadding="0" cellspacing="0">
    <tr style="height:100px;">
        <td style="height:100px;background:#FFFFFF;vertical-align:middle;padding:0 0 0 40px;">
            <div style="font-size:62px;font-weight:bold;color:#000000;line-height:64px;">黄瓜</div>
            <div style="font-size:22px;color:#000000;line-height:26px;">新鲜蔬菜</div>
        </td>
        <td style="width:180px;background:#FFFFFF;vertical-align:top;padding:18px 26px 0 0;text-align:right;">
            <div style="display:inline-block;width:130px;background:#E60012;color:#FFD800;font-size:42px;font-weight:bold;line-height:46px;text-align:center;padding:6px 0;box-sizing:border-box;">促销</div>
        </td>
    </tr>
    <tr style="height:282px;">
        <td style="height:282px;background:#FFD800;vertical-align:middle;padding:0 0 0 40px;">
            <div style="display:inline-block;width:96px;background:#E60012;color:#FFFFFF;font-size:26px;font-weight:bold;line-height:36px;text-align:center;box-sizing:border-box;">促销价</div>
            <div style="height:150px;margin-top:8px;white-space:nowrap;">
                <span style="color:#E60012;font-size:56px;font-weight:bold;">¥</span><span style="color:#E60012;font-size:150px;font-weight:bold;">0.76</span><span style="color:#E60012;font-size:42px;font-weight:bold;">元</span>
            </div>
        </td>
        <td style="width:250px;background:#FFD800;vertical-align:middle;padding:0 40px 0 0;text-align:center;">
            <div style="font-size:24px;color:#000000;line-height:32px;">原价</div>
            <div style="font-size:46px;font-weight:bold;color:#000000;line-height:60px;text-decoration:line-through;white-space:nowrap;">¥9.99</div>
        </td>
    </tr>
    <tr style="height:86px;">
        <td style="height:86px;background:#000000;vertical-align:middle;padding:0 0 0 40px;">
            <div style="font-size:30px;font-weight:bold;color:#FFFFFF;line-height:42px;">产地：山东</div>
        </td>
        <td style="width:240px;background:#000000;vertical-align:middle;padding:0 40px 0 0;text-align:right;">
            <div style="font-size:22px;color:#FFD800;line-height:30px;">产地直供 · 新鲜到货</div>
        </td>
    </tr>
</table>
</div>
</body>
</html>
