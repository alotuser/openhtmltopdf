<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>电子价签</title>
<style>
@page {
    size: 800px 480px;
    margin: 0;
    padding: 0;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 480px;
    box-sizing: border-box;
}

html {
    font-family: 'TestFont';
}

.canvas {
    width: 800px;
    height: 480px;
    box-sizing: border-box;
    border: 3px solid #2b2b2b;
    border-radius: 14px;
    overflow: hidden;
    background-color: #ffffff;
}

.layout {
    width: 794px;
    height: 474px;
    border-collapse: collapse;
}

.badgeCell {
    height: 74px;
    padding: 12px 28px 8px 0;
    vertical-align: top;
    text-align: right;
}

.badge {
    display: inline-block;
    width: 130px;
    height: 54px;
    background-color: #d81e06;
    border-radius: 8px;
    text-align: center;
}

.badgeText {
    font-size: 26px;
    line-height: 54px;
    font-weight: bold;
    color: #ffffff;
}

.nameCell {
 /*   height: 92px;*/
    padding: 6px 20px;
    vertical-align: middle;
    text-align: center;
}

.pName {
    font-size: 40px;
    line-height: 48px;
    font-weight: bold;
    color: #1a1a1a;
    margin: 0;
}

.pSpec {
    font-size: 20px;
    line-height: 30px;
    color: #777777;
    margin: 0;
}

.priceCell {
/*    height: 224px;*/
    padding: 12px 20px;
    vertical-align: middle;
    text-align: center;
}

.priceLabel {
    font-size: 24px;
    line-height: 32px;
    font-weight: bold;
    color: #d81e06;
    margin: 0;
}

.priceValue {
    font-size: 110px;
    line-height: 130px;
    font-weight: bold;
    color: #d81e06;
    margin: 0;
}

.priceUnit {
    font-size: 32px;
    font-weight: bold;
    color: #d81e06;
}

.origPrice {
    font-size: 26px;
    line-height: 36px;
    color: #888888;
    margin: 0;
}

.strike {
    text-decoration: line-through;
}

.bottomCell {
   /* height: 66px;*/
    padding: 16px 20px;
    vertical-align: middle;
    text-align: center;
}

.bottomText {
    font-size: 22px;
    line-height: 32px;
    color: #555555;
    margin: 0;
}
</style>
</head>
<body>
<div class="canvas">
<table class="layout" cellpadding="0" cellspacing="0">
<tr>
<td class="badgeCell"><div class="badge"><span class="badgeText">促销</span></div></td>
</tr>
<tr>
<td class="nameCell">
<p class="pName">苹果</p>
<p class="pSpec">新鲜水果 · 精选好物</p>
</td>
</tr>
<tr>
<td class="priceCell">
<p class="priceLabel">促销价</p>
<p class="priceValue">0.76<span class="priceUnit"> 元/斤</span></p>
<p class="origPrice">原价 <span class="strike">9.99 元/斤</span></p>
</td>
</tr>
<tr>
<td class="bottomCell">
<p class="bottomText">产地：山东　|　计价单位：元/斤</p>
</td>
</tr>
</table>
</div>
</body>
</html>
