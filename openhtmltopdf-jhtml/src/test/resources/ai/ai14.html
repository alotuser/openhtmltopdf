<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>电子价签 胡萝卜</title>
<style>
@page {
    size: 800px 480px;
    margin: 0;
    padding: 0;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 480px;
    box-sizing: border-box;
}
html {
    font-family: 'TestFont';
}
.canvas {
    width: 800px;
    height: 480px;
    box-sizing: border-box;
    border: 3px solid #000000;
    border-radius: 16px;
    background-color: #ffffff;
    overflow: hidden;
}
.layout {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
}
.td-head {
    padding: 20px 36px 16px 36px;
    background-color: #ffffff;
    vertical-align: middle;
}
.head-table {
    width: 100%;
    border-collapse: collapse;
}
.head-name {
    font-size: 38px;
    line-height: 52px;
    font-weight: bold;
    color: #000000;
    text-align: left;
    vertical-align: middle;
}
.head-badge {
    width: 130px;
    text-align: right;
    vertical-align: middle;
}
.badge {
    display: inline-block;
    width: 130px;
    padding: 12px 0px;
    box-sizing: border-box;
    background-color: #ff0000;
    color: #ffffff;
    font-size: 22px;
    font-weight: bold;
    line-height: 30px;
    text-align: center;
    border-radius: 8px;
}
.td-price {
    padding: 0px;
    background-color: #ffff00;
}
.price-table {
    width: 100%;
    border-collapse: collapse;
}
.price-now {
    width: 60%;
    padding: 50px 10px 50px 36px;
    vertical-align: middle;
    text-align: left;
}
.promo-label {
    font-size: 26px;
    line-height: 36px;
    font-weight: bold;
    color: #000000;
    text-align: left;
}
.promo-price {
    font-size: 100px;
    line-height: 124px;
    font-weight: bold;
    color: #ff0000;
    text-align: left;
    white-space: nowrap;
}
.cur {
    font-size: 48px;
}
.unit {
    font-size: 34px;
    color: #000000;
}
.price-old {
    width: 40%;
    padding: 50px 36px 50px 10px;
    vertical-align: middle;
    text-align: center;
}
.old-label {
    font-size: 24px;
    line-height: 34px;
    color: #000000;
    text-align: center;
}
.old-price {
    font-size: 44px;
    line-height: 58px;
    font-weight: bold;
    color: #000000;
    text-decoration: line-through;
    text-align: center;
    white-space: nowrap;
}
.td-foot {
    padding: 20px 36px;
    background-color: #ffffff;
    vertical-align: middle;
}
.foot-text {
    min-height: 36px;
    font-size: 26px;
    line-height: 36px;
    color: #000000;
    text-align: left;
}
</style>
</head>
<body>
<div class="canvas">
<table class="layout" cellpadding="0" cellspacing="0">
<tr>
<td class="td-head">
<table class="head-table" cellpadding="0" cellspacing="0">
<tr>
<td class="head-name">胡萝卜</td>
<td class="head-badge"><span class="badge">促销</span></td>
</tr>
</table>
</td>
</tr>
<tr>
<td class="td-price">
<table class="price-table" cellpadding="0" cellspacing="0">
<tr>
<td class="price-now">
<div class="promo-label">促销价</div>
<div class="promo-price"><span class="cur">&#165;</span>0.76<span class="unit">元</span></div>
</td>
<td class="price-old">
<div class="old-label">原价</div>
<div class="old-price">&#165;9.99</div>
</td>
</tr>
</table>
</td>
</tr>
<tr>
<td class="td-foot"><div class="foot-text">产地：山东</div></td>
</tr>
</table>
</div>
</body>
</html>
